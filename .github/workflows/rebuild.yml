# Weekly data rebuild: pulls NVD + KEV + EPSS, re-measures KEV enrichment and the KEV lag,
# rebuilds site/index.html, commits the changed data, and deploys Pages.
#
# Setup (once): Settings → Secrets and variables → Actions → New repository secret
#   NVD_API_KEY = <your key>
#
# Why this workflow deploys Pages itself: a commit pushed with the default GITHUB_TOKEN does not
# trigger other workflows, so pages.yml's `on: push` would never fire for these commits.
#
# Not run here, on purpose:
#   - scripts/research/osv_orphans.py   (needs ~3.1 GB of OSV exports; the orphan row drops off the
#                                        page once the window moves, as build_site.py intends)
#   - scripts/research/recheck_volume.py (one-time measurement; recheck_measured.json stays dated Nov 7)
#   - scripts/check_cost_model.py       (only needed when cost_model.py or site/cost.js change)
name: Weekly rebuild

on:
  schedule:
    - cron: "47 12 * * 1"   # Mondays 12:47 UTC (off the hour to avoid scheduler delays)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Own group, never cancelled: a push to main (pages.yml) must not kill a half-finished pull.
concurrency:
  group: weekly-rebuild
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      SITE_URL: https://daviswk.github.io/nvd-watch/
    steps:
      - uses: actions/checkout@v4

      - name: Fail fast if the API key secret is missing
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::error::NVD_API_KEY secret is not set (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Each step stops the job on error, so a failed or partial pull is never committed or deployed.
      - name: Pull NVD, KEV and EPSS (last 30 days)
        run: python scripts/fetch_sample.py --days 30

      - name: KEV enrichment timing (NVD change history)
        run: python scripts/kev_enrichment.py

      - name: KEV lag by year
        run: python scripts/kev_lag.py

      - name: Build the page
        run: python scripts/build_site.py

      - name: Commit changed data and page
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed/summary.json data/processed/kev_enrichment.json data/processed/kev_lag.json \
                  data/history site/index.html site/data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly data rebuild ($(date -u +%Y-%m-%d))"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: rebuild
    runs-on: ubuntu-latest
    # Shares pages.yml's group so two deploys never overlap; never cancelled mid-deploy.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
